name: Servidor ForgeOS (acciones remotas)

# Lanzado a mano (o por Claude vía API). La clave SSH del secreto solo puede ejecutar
# /usr/local/bin/forgeos-remote en el servidor (forced command), nada más.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción en el servidor"
        required: true
        default: status
        type: choice
        options: [status, deploy, patches, broker-proposals]

concurrency:
  group: forgeos-server
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.FORGEOS_SSH_KEY }}
          SSH_HOST: ${{ secrets.FORGEOS_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.FORGEOS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Normaliza copias desde Windows: quita \r, espacios sobrantes y líneas vacías.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "líneas de la clave: $(wc -l < ~/.ssh/id_ed25519) (primera: $(head -c 36 ~/.ssh/id_ed25519))"
          if ssh-keygen -y -f ~/.ssh/id_ed25519 > /tmp/pub 2>/tmp/keyerr; then
            echo "huella de la clave: $(ssh-keygen -lf /tmp/pub)"
          else
            echo "CLAVE INVÁLIDA: $(cat /tmp/keyerr)"
          fi
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          echo "huella del servidor:"; ssh-keygen -lf ~/.ssh/known_hosts || true
          { echo "--- preparación ---"; echo "líneas clave: $(wc -l < ~/.ssh/id_ed25519)"; cat /tmp/keyerr 2>/dev/null; ssh-keygen -lf /tmp/pub 2>/dev/null; } > ~/prep.txt

      - name: Ejecutar "${{ inputs.action }}"
        env:
          SSH_HOST: ${{ secrets.FORGEOS_SSH_HOST }}
          ACTION: ${{ inputs.action }}
        run: |
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "root@$SSH_HOST" "$ACTION" > remote-output.txt 2>&1
          rc=$?
          if [ $rc -eq 255 ]; then
            echo "--- diagnóstico SSH (código 255) ---" >> remote-output.txt
            ssh -v -o BatchMode=yes -o ConnectTimeout=20 "root@$SSH_HOST" status 2>&1 \
              | grep -E "Connecting|Connection|Authenticat|Offering|Server accepts|denied|Host key|REMOTE HOST|refused|timed out" \
              | head -20 >> remote-output.txt
          fi
          cat ~/prep.txt >> remote-output.txt 2>/dev/null
          echo "codigo_salida=$rc" >> remote-output.txt
          cat remote-output.txt
          echo "$rc" > rc.txt

      - name: Publicar salida en la rama server-output
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          ACTION: ${{ inputs.action }}
        run: |
          [ -f remote-output.txt ] || echo "sin salida" > remote-output.txt
          git init -q out && cd out
          git config user.name "forgeos-actions"; git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin server-output 2>/dev/null && git checkout -q FETCH_HEAD || true
          git checkout -q -B server-output
          mkdir -p runs
          cp ../remote-output.txt "runs/${RUN_ID}-${ACTION}.txt"
          cp ../remote-output.txt "ultimo-${ACTION}.txt"
          ls runs | sort -r | tail -n +51 | sed 's#^#runs/#' | xargs -r git rm -q --ignore-unmatch || true
          git add -A && git commit -q -m "salida ${ACTION} run ${RUN_ID}" && git push -q origin server-output

      - name: Resultado
        if: always()
        run: exit "$(cat rc.txt 2>/dev/null || echo 1)"
