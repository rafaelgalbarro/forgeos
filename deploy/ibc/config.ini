# IBC config template for unattended IB Gateway login (copy to container).
# Target path inside gateway image/host:
#   /home/ibgateway/ibc/config.ini
#
# Apply (example):
#   docker cp deploy/ibc/config.ini ib-gateway:/home/ibgateway/ibc/config.ini
#   docker restart ib-gateway
#
# WARNING: Store credentials via IBC secrets / env — do not commit passwords.

TradingMode=live
ReadOnlyApi=no
AcceptIncomingConnectionAction=accept
AutoLogoffTime=
LoginDialogDisplayTimeout=180

# Optional (set via your IBC deployment, not committed here):
# IbLoginId=
# IbPassword=
# IbDirectory=
# ClosedownAt=
